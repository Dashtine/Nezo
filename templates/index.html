<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nezo6</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- ========================== -->
  <!-- Login Overlay -->
  <!-- ========================== -->
  <div id="loginOverlay">
    <div style="text-align:center; margin-top:20%;">
      <h2>Enter Username</h2>
      <input type="text" id="usernameInput" placeholder="Username">
      <button onclick="submitUsername()">Login</button>
    </div>
  </div>
  <!-- ========================== -->
  <!-- Account Settings Section -->
  <!-- ========================== -->
  <div class="form-container" id="accountSettings">
    <h2 style="margin-bottom:10px;"></h2>

    <!-- Propfirm Username -->
    <div class="form-group">
      <label for="propUsername">Prop Firm Username:</label>
      <div class="input-wrapper">
        <input 
          type="text" 
          id="propUsername" 
          name="propUsername" 
          placeholder="Enter your prop firm username"
        >
      </div>
    </div>

    <!-- API Key -->
    <div class="form-group">
      <label for="apiKey">API Key:</label>
      <div class="input-wrapper">
        <input 
          type="password" 
          id="apiKey" 
          name="apiKey" 
          placeholder="Enter your API key"
        >
        <button 
          type="button" 
          id="validateAndSave" 
          class="save"
          style="margin-left:10px; padding:8px 15px;"
        >
          Set
        </button>
      </div>
    </div>

    <!-- Account Selection -->
    <div class="form-group">
      <label for="accountInput">Account:</label>
      <div class="input-wrapper">
        <input 
          type="text" 
          id="accountInput" 
          name="accountInput" 
          placeholder="e.g. 50KTC-V2-171261-99323003"
        >
        <button 
          type="button" 
          id="setAccountBtn" 
          class="save"
          style="margin-left:10px; padding:8px 15px;"
        >
          Set
        </button>
      </div>
    </div>

    <!-- Contract / Symbol -->
    <div class="form-group">
      <label for="symbolInput">Symbol:</label>
      <div class="input-wrapper">
        <input 
          type="text" 
          id="symbolInput" 
          name="symbolInput" 
          placeholder="e.g. MNQZ25"
        >
        <button 
          type="button" 
          id="setSymbolBtn" 
          class="save"
          style="margin-left:10px; padding:8px 15px;"
        >
          Set
        </button>
      </div>
    </div>

    <p id="tokenStatus" style="text-align:center; margin-top:10px; color:#333; font-size:14px;"></p>
  </div>

  <!-- ========================== -->
  <!-- Bot Controls -->
  <!-- ========================== -->
  <button id="toggleButton" class="start" onclick="toggleBot()">Start</button>
  <div id="logs"></div>

  <!-- ========================== -->
  <!-- Bot Settings -->
  <!-- ========================== -->
  <div class="form-container">
    <form id="settingsForm">
      <div class="form-group">
        <label for="tpslMethod"><b><u>Mode:</u></b></label>
        <label for="tpslMethod" style="margin-left: 2.8in;">Levels</label>
        <div class="input-wrapper">
          <input type="radio" style="margin-top:15px;" id="useLevels" name="tpslMethod"  value="levels" checked>
        </div>
        <label for="tpslMethod" style="margin-left: 60px;">Ticks</label>
        <div class="input-wrapper">
           <input type="radio" style="margin-top:15px;" id="useTicks" name="tpslMethod" value="ticks">
        </div>
        <button type="button" style="margin-left: 2.4in;" class="save" onclick="saveSettings()">Save</button>
      </div>
    </form>
  </div>

  <!-- SETTINGS FOR 'TICKS' MODE -->
  <div class="form-container">
    <form id="settingsForm">
      <div class="form-group">
        <label for="contracts">Contracts:</label>
        <div class="input-wrapper">
          <input type="number" id="contracts" name="contracts" placeholder="0" value=0>
        </div>

        <label for="takeProfit">Take Profit:</label>
        <div class="input-wrapper">
          <input type="number" id="takeProfit" name="takeProfit" placeholder="0" value=0>
        </div>

        <label for="stopLoss">Stop Loss:</label>
        <div class="input-wrapper">
          <input type="number" id="stopLoss" name="stopLoss" placeholder="0" value=0>
        </div>
      </div>
    </form>
  </div>

  <!-- SETTINGS FOR 'LEVELS' MODE -->
  <div class="form-container">
    <div class="form-group">
    <!-- TP Contract Sizes -->
      <label for="tp1Contracts" style="margin-top:15px;">TP1 Contracts:</label>
      <div class="input-wrapper">
        <input type="number" id="contractsTP1" name="contractsTP1" placeholder="0" value=0>
      </div>

      <label for="tp2Contracts" style="margin-top:15px;">TP2 Contracts:</label>
      <div class="input-wrapper">
        <input type="number" id="contractsTP2" name="contractsTP2" placeholder="0" value=0>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-group">
    <!-- Breakeven Flags -->
     <label style="min-width: 140px;">Breakeven Options:</label>
     <label>First Level</label>
      <div class="input-wrapper">
        <input type="radio" style="max-width: 15px; margin-top:8px;" id="beFirstInt" name="beMethod" value="first">
      </div>  

      <label>TP 1</label>
      <div class="input-wrapper">
        <input type="radio" style="max-width: 15px; margin-top:8px;" id="beAtTP1" name="beMethod" value="tp1">
      </div>   

      <label>None</label>
      <div class="input-wrapper">
        <input type="radio" style="max-width: 15px; margin-top:8px;" id="beNone" name="beMethod" value="" checked>
      </div>   
      
    </div>  
  </div>

  <!-- ========================== -->
  <!-- Backup Levels (for Levels mode) -->
  <!-- ========================== -->
  <div style="height:10px;"></div> 
  <div class="form-container">
      <label class="form-group">
        Backup Levels (use ticks if no levels are found):
      </label>
  </div>
  <div style="height:10px;"></div> 
  <div class="form-container" id="backupLevelsSection">
    <div class="form-group">
      <div style="height:10px;"></div> 
      <label for="backupTP1" style="min-width:95px;">Backup TP1</label>
      <div class="input-wrapper">
        <input type="number" style="width:80px;" id="backupTP1" name="backupTP1" placeholder="0" value="0">
      </div>

      <label for="backupTP2" style="min-width:100px;">Backup TP2:</label>
      <div class="input-wrapper">
        <input type="number" style="width:80px;" id="backupTP2" name="backupTP2" placeholder="0" value="0">
      </div>

      <label for="backupSL" style="min-width:95px;">Backup SL:</label>
      <div class="input-wrapper">
        <input type="number" style="width:80px;" id="backupSL" name="backupSL" placeholder="0" value="0">
      </div>
    </div>
    <p style="font-size:12px; color:#555; margin-top:8px; margin-left:5px; font-style:italic;">
      *If TP1 level is found but TP2 is missing, TP2 will automatically be set 0.02% above or below TP1 (based on direction).*
    </p>
  </div>

  <!-- ========================== -->
  <!-- Additional Settings -->
  <!-- ========================== -->
  <div class="form-container">
    <form id="settingsForm">
      <div class="form-group" style="display:inline; align-items:center;">
        <label for="tpslMethod" style="display:inline; font-weight:bold;"><u>Additional Settings</u></label>
        <div style="height:10px;"></div> 
        <div style="display:flex; align-items:center; gap:10px;">
          <label for="useMacro" style="margin:0;">Macro Times Only</label>
          <input type="checkbox" id="useMacro" name="useMacro">
          <p style="font-size:12px; color:#555; margin-top:8px; margin-left:5px; font-style:italic;">
          *Only works for NY session with first macro at 06:20 and last one at 12:50. For Asian/London, macro times are ignored.*
          </p>
        </div>
      </div>
      <div class="sessions">
        <div style="height:10px;"></div> 
            <!-- Custom Session 1 -->
        <div style="margin-bottom: 15px;">
          <label>Session 1:</label>
          <input type="checkbox" id="session1_enabled" name="session1_enabled" checked>
          <input class="times" type="time" id="session1_start" name="session1_start" value="06:29">
          <span>–</span>
          <input class="times" type="time" id="session1_end" name="session1_end" value="12:41">
        </div>

        <!-- Custom Session 2 -->
        <div style="margin-bottom: 15px;">
          <label>Session 2:</label>
          <input type="checkbox" id="session2_enabled" name="session2_enabled" style="">
          <input class="times" type="time" id="session2_start" name="session2_start" value="16:59">
          <span>  –  </span>
          <input class="times" type="time" id="session2_end" name="session2_end" value="21:01">
        </div>

        <!-- Custom Session 3 -->
        <div style="margin-bottom: 15px;">
          <label>Session 3:</label>
          <input type="checkbox" id="session3_enabled" name="session3_enabled">
          <input class="times" type="time" id="session3_start" name="session3_start" value="11:59">
          <span>– </span>
          <input class="times" type="time" id="session3_end" name="session3_end" value="02:01">
        </div>    
      </div>
    </form>
  </div>
  <!-- ========================== -->
  <!-- Test Buttons -->
  <!-- ========================== -->
  <div style="height:20px;"></div> 
  <div style="margin-left:3.3in;">
    <button id="testlongbtn" style="background-color:rgb(1,113,1);" class="start" onclick="TestLong()">Test Long</button>
    <button id="testshortbtn" style="background-color:rgb(173,14,14);" class="start" onclick="TestShort()">Test Short</button>
  </div>


  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
document.addEventListener("DOMContentLoaded", () => {
  const levelsRadio = document.getElementById("useLevels");
  const ticksRadio = document.getElementById("useTicks");

  // Sections
  const ticksSettings = document.querySelectorAll("#contracts, #takeProfit, #stopLoss");
  const levelsSettings = document.querySelectorAll(
  "#contractsTP1, #contractsTP2, #beFirstInt, #beAtTP1, #beNone, #backupTP1, #backupTP2, #backupSL"
);


  function updateSettingsState() {
    const useLevels = levelsRadio.checked;

    // Enable/disable Ticks settings
    ticksSettings.forEach(input => {
      input.disabled = useLevels;
      input.style.opacity = useLevels ? "0.5" : "1";
    });

    // Enable/disable Levels settings
    levelsSettings.forEach(input => {
      input.disabled = !useLevels;
      input.style.opacity = !useLevels ? "0.5" : "1";
    });
  }

  // Run when the page loads
  updateSettingsState();

  // Add listeners
  levelsRadio.addEventListener("change", updateSettingsState);
  ticksRadio.addEventListener("change", updateSettingsState);
});
</script>

</body>
</html>
