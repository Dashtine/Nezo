<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="loginOverlay">
        <div style="text-align:center; margin-top:20%;">
            <h2>Enter Username</h2>
            <input type="text" id="usernameInput" placeholder="Username">
            <button onclick="submitUsername()" style="">Login</button>
        </div>
    </div>
    <h1></h1>
    <button id="toggleButton" class="start" onclick="toggleBot()">Start</button>
    <div id="logs"></div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <div class="form-container">
        <form id="settingsForm">
            <div class="form-group">
                <label for="tradeAmount">Contracts</label>
                <div class="input-wrapper">
                    <input type="number" id="contracts" name="tradeAmount" placeholder="0">
                    <span class="input-symbol"></span>
                </div>

                <label for="takeProfit">Take Profit:</label>
                <div class="input-wrapper">
                    <input type="number" id="takeProfit" name="takeProfit" placeholder="0">
                    <span class="input-symbol"></span>
                </div>

                <label for="stopLoss">Stop Loss:</label>
                <div class="input-wrapper">
                    <input type="number" id="stopLoss" name="stopLoss" placeholder="0">
                    <span class="input-symbol"></span>
                </div>
                
                <button type="button" class="save" onclick="saveSettings()">Save</button>
            </div>
        </form>
    </div>
    <div>   
       <button id="testlongbtn" style="background-color:rgb(1, 113, 1)" class="start" onclick="TestLong()">Test Long</button>
       <button id="testshortbtn" style="background-color:rgb(173, 14, 14)" class="start" onclick="TestShort()">Test Short</button>
    </div> 
</body>
</html>
